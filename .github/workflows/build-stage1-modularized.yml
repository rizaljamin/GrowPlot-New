name: Stage 1 modularized ARM64 APK
on:
  push:
    branches: [refactor/stage1-modularize-assets]
    paths: ['.github/workflows/build-stage1-modularized.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - name: Verify modularized assets
        run: |
          set -euo pipefail
          test -s app/src/main/assets/index.html
          test -s app/src/main/assets/css/app.css
          test -s app/src/main/assets/js/app.js
          grep -Fq 'href="css/app.css"' app/src/main/assets/index.html
          grep -Fq 'src="js/app.js"' app/src/main/assets/index.html
          node --check app/src/main/assets/js/app.js
      - name: Run regression tests
        run: |
          node tools/tests/kindwise-regression.js
          node tools/tests/manage-farm-regression.js
          node tools/tests/account-registration-regression.js
      - name: Build ARM64 APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --max-workers=1 -Pandroid.useAndroidX=true -PgrowplotAbi=arm64-v8a assembleDebug
      - name: Verify APK
        run: |
          set -euo pipefail
          test -s app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
          unzip -Z1 app/build/outputs/apk/debug/app-debug.apk | grep -qx 'lib/arm64-v8a/libvlc.so'
          if unzip -Z1 app/build/outputs/apk/debug/app-debug.apk | grep -q '^lib/armeabi-v7a/'; then exit 1; fi
      - name: Package source, manifest, and APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release/stage1
          cp app/build/outputs/apk/debug/app-debug.apk release/stage1/GrowPlot-stage1-arm64-development-only.apk
          git archive --format=zip --output=release/stage1/GrowPlot-stage1-source.zip HEAD
          {
            echo "GrowPlot Stage 1 modularized build manifest"
            echo "source_commit=$(git rev-parse HEAD)"
            echo "source_branch=$(git branch --show-current)"
            cat version.properties
            echo "abi=arm64-v8a"
            echo "signing=development-only (GitHub runner debug key; not the permanent GrowPlot certificate)"
            echo "source_archive=GrowPlot-stage1-source.zip"
            echo "apk=GrowPlot-stage1-arm64-development-only.apk"
          } > release/stage1/BUILD-MANIFEST.txt
          (cd release/stage1 && sha256sum GrowPlot-stage1-source.zip GrowPlot-stage1-arm64-development-only.apk > SHA256SUMS.txt)
          (cd release/stage1 && zip -q ../GrowPlot-stage1-complete-bundle.zip GrowPlot-stage1-source.zip GrowPlot-stage1-arm64-development-only.apk BUILD-MANIFEST.txt SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: GrowPlot-stage1-complete-bundle
          path: release/GrowPlot-stage1-complete-bundle.zip
          retention-days: 14

