name: Sync verified GrowPlot artifacts to Google Drive

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing GitHub Release tag with APK, source ZIP and manifest assets"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: growplot-drive-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    environment: growplot-drive-sync
    steps:
      - name: Validate configuration
        env:
          GDRIVE_CREDENTIALS: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
          GDRIVE_FOLDER_ID: ${{ vars.GDRIVE_FOLDER_ID }}
        run: |
          test -n "$GDRIVE_CREDENTIALS" || { echo "Missing GDRIVE_SERVICE_ACCOUNT_JSON secret"; exit 1; }
          test -n "$GDRIVE_FOLDER_ID" || { echo "Missing GDRIVE_FOLDER_ID variable"; exit 1; }
      - name: Download exact release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
        run: |
          mkdir -p artifacts
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir artifacts
          find artifacts -maxdepth 1 -type f -printf '%f\n'
      - name: Install Drive client
        run: python -m pip install --disable-pip-version-check google-api-python-client google-auth
      - name: Verify and upload without overwriting mismatched files
        env:
          GDRIVE_CREDENTIALS: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
          GDRIVE_FOLDER_ID: ${{ vars.GDRIVE_FOLDER_ID }}
          SOURCE_COMMIT: ${{ github.sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: python .github/scripts/sync_drive.py artifacts
