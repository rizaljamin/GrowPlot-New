name: Embed CV Frames in Photo Analysis
on:
  push:
    paths: ['.github/workflows/embed-cv-in-photo-analysis.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Embed two frames inside existing Photo analysis section
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/assets/index.html')
          h=p.read_text(encoding='utf-8')
          marker='<div id="diagnosisAnalysis"><div id="diagnosisDescription">'
          assert h.count(marker)==1, 'Photo analysis insertion point missing'
          frame='''<div id="growplotInlineCV" style="display:none;margin:12px 0"><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:14px"><section style="border:1px solid #d6e2d9;border-radius:10px;padding:12px"><h4>1. Original plant photograph</h4><img id="growplotInlineOriginal" alt="Original plant photograph" style="width:100%;max-height:400px;object-fit:contain;border-radius:8px"><p id="growplotInlinePhotoStatus"></p></section><section style="border:1px solid #d6e2d9;border-radius:10px;padding:12px"><h4>2. CV diagnosis</h4><div id="growplotInlineResults" style="min-height:220px;background:#f4f8f5;border-radius:8px;padding:18px">CV analysis output will appear in this frame.</div></section></div></div>'''
          h=h.replace(marker,'<div id="diagnosisAnalysis">'+frame+'<div id="diagnosisDescription">',1)
          start='async function runDiagnosisScreen(camera){showGrowPlotCVWindow(camera);'
          assert start in h,'Expected Run diagnosis handler missing'
          h=h.replace(start,'async function runDiagnosisScreen(camera){showGrowPlotInlineCV(camera);',1)
          helper="""function showGrowPlotInlineCV(camera){
            const host=document.getElementById('growplotInlineCV');
            if(!host)return;
            host.style.display='block';
            const photos=diagnosisMediaFor(camera).filter(item=>item.kind==='photo'&&item.url);
            const photo=photos.slice(-1)[0];
            const image=document.getElementById('growplotInlineOriginal');
            const note=document.getElementById('growplotInlinePhotoStatus');
            const result=document.getElementById('growplotInlineResults');
            if(photo){image.style.display='block';image.src=photo.url;note.textContent='Latest selected section photograph'}
            else{image.style.display='none';image.removeAttribute('src');note.textContent='No photograph available for this section'}
            if(result)result.textContent='CV analysis output will appear in this frame.';
          }
          """
          h=h.replace('async function runDiagnosisScreen(camera){',helper+'async function runDiagnosisScreen(camera){',1)
          assert 'showGrowPlotInlineCV(camera);' in h and 'growplotInlineResults' in h
          p.write_text(h,encoding='utf-8')
          print('PASS: Run diagnosis now opens inline original/CV frames above pixel analysis')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/assets/index.html
          if ! git diff --cached --quiet; then
            git commit -m "fix: embed original photo and CV frames in Photo analysis result"
            git push
          fi
