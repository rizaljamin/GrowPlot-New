name: Apply Stage 1 modularization archive
on:
  push:
    branches:
      - refactor/stage1-modularize-assets
    paths:
      - '.github/workflows/apply-stage1-modularization.yml'
      - 'GrowPlot-modularized-stage1.zip'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Validate and extract Stage 1
        shell: bash
        run: |
          set -euo pipefail
          test -s GrowPlot-modularized-stage1.zip
          unzip -t GrowPlot-modularized-stage1.zip
          python3 - <<'PY'
          import zipfile
          expected = {
            'app/src/main/assets/index.html',
            'app/src/main/assets/css/app.css',
            'app/src/main/assets/js/app.js',
          }
          with zipfile.ZipFile('GrowPlot-modularized-stage1.zip') as z:
              names = set(z.namelist())
              assert names == expected, f'Unexpected archive contents: {names ^ expected}'
              assert all(not name.startswith('/') and '..' not in name.split('/') for name in names)
              z.extractall('.')
          PY
          test -s app/src/main/assets/index.html
          test -s app/src/main/assets/css/app.css
          test -s app/src/main/assets/js/app.js
      - name: Commit extracted modularization files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/index.html app/src/main/assets/css/app.css app/src/main/assets/js/app.js
          if git diff --cached --quiet; then
            echo "Stage 1 files already match archive"
            exit 0
          fi
          git commit -m "refactor: extract Stage 1 HTML CSS and JS assets"
          git push origin HEAD:refactor/stage1-modularize-assets
