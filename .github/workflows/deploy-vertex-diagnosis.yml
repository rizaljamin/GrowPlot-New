name: Deploy GrowPlot Firebase callables

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'functions/**'
      - 'firebase.json'
      - '.github/workflows/deploy-vertex-diagnosis.yml'

permissions:
  contents: read

concurrency:
  group: growplot-firebase-callables
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: firebase-production
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GROWPLOT_FIREBASE_DEPLOY_SERVICE_ACCOUNT }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Show authenticated deploy principal
        run: |
          node -e "const fs=require('fs'); const c=JSON.parse(fs.readFileSync(process.env.GOOGLE_APPLICATION_CREDENTIALS,'utf8')); console.log('Authenticated deploy principal:', c.client_email || '(not available)')"
      - name: Install and check Firebase functions
        working-directory: functions
        run: |
          npm install --ignore-scripts
          npm run lint
      - name: Deploy Firebase callables to GrowPlot
        run: npx --yes firebase-tools@14 deploy --only functions:vertexImageDiagnosis,functions:getMonthlyRetailCropPrices --project growplot --non-interactive --force
