name: Build GrowPlot ARM64 APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'version.properties'
      - 'app/**'
      - 'gradle/**'
      - 'gradlew'
      - 'gradle.properties'
      - 'settings.gradle'
      - 'build.gradle'
      - 'tools/**'
      - '.github/workflows/android-arm64-build.yml'

permissions:
  contents: read

concurrency:
  group: growplot-arm64-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - name: Build and verify ARM64
        env:
          GROWPLOT_PLANTNET_API_KEY: ${{ secrets.GROWPLOT_PLANTNET_API_KEY }}
        run: |
          chmod +x gradlew tools/*.sh
          ./tools/build-apk.sh
      - name: Verify release manifest and package
        run: |
          test "$(find release -maxdepth 1 -name '*.apk' | wc -l)" -eq 1
          test "$(find release -maxdepth 1 -name '*-source.zip' | wc -l)" -eq 1
          test "$(find release -maxdepth 1 -name '*-build-manifest.txt' | wc -l)" -eq 1
          grep -q '^Version: 0.6.01 Build 10$' release/*-build-manifest.txt
          grep -q '^versionCode: 137$' release/*-build-manifest.txt
          sha256sum release/*
      - name: Upload Build 10 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GrowPlot-v0.6.01-Build-10-ARM64
          path: |
            release/*.apk
            release/*-source.zip
            release/*-build-manifest.txt
          if-no-files-found: error
          retention-days: 30
