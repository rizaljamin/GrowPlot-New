name: Build GrowPlot ARM64 APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'version.properties'
      - 'app/**'
      - 'gradle/**'
      - 'gradlew'
      - 'gradle.properties'
      - 'settings.gradle'
      - 'build.gradle'
      - 'tools/**'
      - '.github/workflows/**'

permissions:
  contents: read

concurrency:
  group: growplot-arm64-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore stable APK signing key
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.GROWPLOT_SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.GROWPLOT_SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.GROWPLOT_SIGNING_KEY_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.GROWPLOT_SIGNING_KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -n "$SIGNING_KEYSTORE_BASE64" || { echo "::error::Missing stable APK signing keystore secret"; exit 1; }
          test -n "$SIGNING_STORE_PASSWORD" || { echo "::error::Missing signing store password"; exit 1; }
          test -n "$SIGNING_KEY_ALIAS" || { echo "::error::Missing signing key alias"; exit 1; }
          umask 077
          printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/growplot-signing.jks"
          echo "GROWPLOT_DEBUG_KEYSTORE=$RUNNER_TEMP/growplot-signing.jks" >> "$GITHUB_ENV"
          echo "GROWPLOT_DEBUG_KEY_ALIAS=$SIGNING_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "GROWPLOT_DEBUG_KEYSTORE_PASSWORD=$SIGNING_STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "GROWPLOT_DEBUG_KEY_PASSWORD=${SIGNING_KEY_PASSWORD:-$SIGNING_STORE_PASSWORD}" >> "$GITHUB_ENV"
      - name: Build and verify ARM64
        env:
          GROWPLOT_PLANTNET_API_KEY: ${{ secrets.GROWPLOT_PLANTNET_API_KEY }}
        run: |
          chmod +x gradlew tools/*.sh
          ./tools/build-apk.sh
      - name: Verify release manifest and package
        run: |
          VERSION_NAME="$(sed -n 's/^versionName=//p' version.properties | head -n1)"
          VERSION_CODE="$(sed -n 's/^versionCode=//p' version.properties | head -n1)"
          test "$(find release -maxdepth 1 -name '*.apk' | wc -l)" -eq 1
          test "$(find release -maxdepth 1 -name '*-source.zip' | wc -l)" -eq 1
          test "$(find release -maxdepth 1 -name '*-build-manifest.txt' | wc -l)" -eq 1
          grep -Fxq "Version: $VERSION_NAME" release/*-build-manifest.txt
          grep -Fxq "versionCode: $VERSION_CODE" release/*-build-manifest.txt
          sha256sum release/*
      - name: Upload ARM64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GrowPlot-${{ github.sha }}-ARM64
          path: |
            release/*.apk
            release/*-source.zip
            release/*-build-manifest.txt
          if-no-files-found: error
          retention-days: 30
