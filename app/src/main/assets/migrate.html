<!doctype html><html><head><meta charset="utf-8"></head><body><script>
(function(){
  const data={};
  try {
    for(let i=0;i<localStorage.length;i++){
      const key=localStorage.key(i);
      if(key==='growplotPlots'||key==='growplotSelectedPlot'||key.startsWith('growplotFeedSummary:')) data[key]=localStorage.getItem(key);
    }
  } catch(e) {}
  try { if(window.GrowPlotBridge) GrowPlotBridge.migrateLegacyWebStorage(JSON.stringify(data)); } catch(e) {}
})();
</script></body></html>
