<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GrowPlot - Crop Planning</title><style>body{font:16px system-ui,sans-serif;background:#f4f8f4;color:#173b27;margin:0}.app{max-width:540px;margin:auto;padding:22px}h1{font-size:23px}.panel,.modal{background:white;border-radius:16px;padding:20px;box-shadow:0 3px 14px #0001}button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:13px 16px}.primary{background:#237b49;color:white;width:100%;text-align:left}.overlay{position:fixed;inset:0;background:#0007;display:grid;place-items:center;padding:18px}.modal{max-width:480px;width:100%;max-height:78vh;overflow:auto;box-sizing:border-box}.hidden{display:none}.crop{display:flex;align-items:center;gap:12px;width:100%;background:#f3f8f3;text-align:left;margin:8px 0}.crop:hover{background:#e3f1e6}.emoji{font-size:30px}.muted{font-size:13px;color:#557365}.fields{display:grid;gap:12px;margin-top:20px}label{display:grid;gap:5px;font-size:14px}input{padding:10px;border:1px solid #bdd0c0;border-radius:8px;font:inherit}header{display:flex;justify-content:space-between;align-items:center}.close{background:#e9efeb}.selected{margin-top:14px;font-weight:600}</style></head><body><main class="app"><h1>🌱 GrowPlot — Crop Planning</h1><section class="panel"><p>Crop Selection</p><button class="primary" id="open">🌱 Select Crop ▾</button><div class="selected" id="selected" aria-live="polite"></div><div class="fields"><label>Planting date<input type="date"></label><label>Number of plants / trees<input type="number" min="1" placeholder="Enter quantity"></label><label>Notes<input placeholder="Optional planting notes"></label></div></section></main><div class="overlay hidden" id="overlay"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="heading"><header><h2 id="heading">Recommended Crops</h2><button class="close" id="close" aria-label="Close">✕</button></header><div id="choices"></div></section></div><script>const crops=[['🌶️','Chilli','Fertigation-friendly cash crop'],['🍆','Eggplant','Fruit vegetable for warm climates'],['🥒','Cucumber','Climbing vegetable crop'],['🍌','Banana','Tropical fruit crop'],['🌳','Durian','Long-term tropical fruit tree'],['🌿','Rubber','Plantation crop']];const overlay=document.getElementById('overlay');const open=()=>{overlay.classList.remove('hidden');document.getElementById('close').focus()};const close=()=>overlay.classList.add('hidden');document.getElementById('open').onclick=open;document.getElementById('close').onclick=close;overlay.addEventListener('click',e=>{if(e.target===overlay)close()});document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});for(const [icon,name,description] of crops){const button=document.createElement('button');button.className='crop';button.innerHTML=`<span class="emoji">${icon}</span><span><strong>${name}</strong><br><span class="muted">${description}</span></span>`;button.onclick=()=>{document.getElementById('open').textContent=`${icon} ${name} ▾`;document.getElementById('selected').textContent=`Selected crop: ${name}`;close()};document.getElementById('choices').append(button)}</script></body></html>
