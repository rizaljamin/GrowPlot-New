plugins { id 'com.android.application'; id 'com.google.gms.google-services' }

def releaseIdentity = new Properties()
file('../version.properties').withInputStream { releaseIdentity.load(it) }
def buildConfigLiteral = { value -> '"' + value.toString().replace('\\', '\\\\').replace('"', '\\"') + '"' }
def configuredSigningStore = System.getenv('GROWPLOT_DEBUG_KEYSTORE')
def configuredSigningAlias = System.getenv('GROWPLOT_DEBUG_KEY_ALIAS') ?: 'androiddebugkey'
def configuredSigningStorePassword = System.getenv('GROWPLOT_DEBUG_KEYSTORE_PASSWORD')
def configuredSigningKeyPassword = System.getenv('GROWPLOT_DEBUG_KEY_PASSWORD') ?: configuredSigningStorePassword
def requestedAbiFilter = project.findProperty('growplotAbi')?.toString()
def configuredAbis = requestedAbiFilter ? [requestedAbiFilter] : ['arm64-v8a']

android {
    namespace 'com.growplot.farm'
    compileSdk 35
    buildToolsVersion '35.0.0'

    defaultConfig {
        applicationId 'com.growplot.farm'
        minSdk 24
        targetSdk 35
        ndk { abiFilters(*configuredAbis) }
        versionCode releaseIdentity.getProperty('versionCode').toInteger()
        versionName releaseIdentity.getProperty('versionName')
    }

    buildFeatures { buildConfig true }
    // Vertex's regional API host is derived from project/location at runtime; these are identifiers, not secrets.
    defaultConfig {
        buildConfigField 'String', 'ACCOUNT_API_URL', buildConfigLiteral(project.findProperty('growplotAccountApiUrl') ?: '')
        buildConfigField 'String', 'VERTEX_PROJECT_ID', buildConfigLiteral(project.findProperty('growplotVertexProjectId') ?: 'growplot')
        buildConfigField 'String', 'VERTEX_LOCATION', buildConfigLiteral(project.findProperty('growplotVertexLocation') ?: 'us-central1')
        buildConfigField 'String', 'VERTEX_MODEL_ID', buildConfigLiteral(project.findProperty('growplotVertexModelId') ?: 'gemini-3.8-flash')
        // Optional authenticated diagnosis proxy settings are retained for YOLO only; Vertex calls bypass them.
        buildConfigField 'String', 'DIAGNOSIS_API_URL', buildConfigLiteral(project.findProperty('growplotDiagnosisApiUrl') ?: '')
        buildConfigField 'String', 'DIAGNOSIS_PROXY_TOKEN', buildConfigLiteral(project.findProperty('growplotDiagnosisProxyToken') ?: '')
    }
    buildTypes {
        debug {
            buildConfigField 'String', 'PLANTNET_API_KEY', buildConfigLiteral(project.findProperty('growplotPlantNetApiKey') ?: '')
        }
        release {
            buildConfigField 'String', 'PLANTNET_API_KEY', buildConfigLiteral(project.findProperty('growplotPlantNetApiKey') ?: '')
        }
    }

    if (configuredSigningStore) {
        signingConfigs {
            stableDebug {
                storeFile file(configuredSigningStore)
                storePassword configuredSigningStorePassword
                keyAlias configuredSigningAlias
                keyPassword configuredSigningKeyPassword
            }
        }
        buildTypes.getByName('debug').signingConfig = signingConfigs.getByName('stableDebug')
    }

    packaging {
        jniLibs { pickFirsts += ['**/libc++_shared.so'] }
    }

}

dependencies {
    implementation 'org.videolan.android:libvlc-all:3.6.5'
    implementation 'org.opencv:opencv:4.10.0'
    implementation platform('com.google.firebase:firebase-bom:35.0.0')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-firestore'
    implementation 'com.google.firebase:firebase-storage'
    implementation 'com.google.firebase:firebase-functions'
    implementation 'com.google.code.gson:gson:2.11.0'
    implementation 'androidx.credentials:credentials:1.3.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.3.0'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.1.1'
    implementation 'com.google.android.gms:play-services-auth:22.0.0'
}

// The package task otherwise may reuse an APK built for the previous version identity.
tasks.configureEach {
    if (name == 'packageDebug') inputs.file(file('../version.properties'))
}
